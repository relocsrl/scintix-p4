name: Bug report
description: Report a malfunction or unexpected behavior
title: "[BUG] "
type: bug
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please fill in the fields below with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
      placeholder: "Example: the device stops responding after sending the command ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Software / firmware version / OS et al.
      placeholder: "e.g. v1.2.3, commit abc123"
    validations:
      required: false

  - type: input
    id: board
    attributes:
      label: Board / device
      placeholder: "e.g. ESP32-S3, STM32F4, custom board ..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or attachments
      description: Paste any relevant logs, screenshots or files here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional notes
      description: Add any other useful details.
    validations:
      required: false