version: 1.0.0
# Devices Configuration for the Scintix P4.
# Derived from espressif/esp32_p4_function_ev, keeping only display + touch
# (audio, SD card and camera removed for the Waveshare CM4-to-Pi4 setup).
devices:
  # DSI Display Device
  - name: display_lcd
    chip: ek79007
    type: display_lcd
    sub_type: dsi
    dependencies:
      espressif/esp_lcd_ek79007: "2.0.*"   # 1.0.x lacks disp_on_off -> panel stays off (black) on this EK79007; 2.0.2 works (as in esp_brookesia_phone)
    config:
      reset_gpio_num: 4   # Scintix: LCD reset on ESP32-P4 GPIO4 (Waveshare 40-pin header GPIO22)
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 48
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 1
        flags:
          use_dma2d: true
          disable_lp: false
        video_timing:
          h_size: 1024
          v_size: 600
          hsync_back_porch : 120
          hsync_pulse_width : 10
          hsync_front_porch : 120
          vsync_back_porch : 20
          vsync_pulse_width : 1
          vsync_front_porch : 20
      peripherals:
      - name: ldo_mipi
      - name: dsi_display

  # Touch Panel Configuration
  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
      touch_config:
        x_max: 1024
        y_max: 600
        flags:
          mirror_x: true
          mirror_y: true
    peripherals:
      - name: i2c_master
        i2c_addr: [0xba, 0x28]

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight
